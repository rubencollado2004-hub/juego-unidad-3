<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape de las tres salas</title>
  <style>
    /* Un único panel y estilos sencillos para entenderlos fácilmente. */
    body { font-family: Arial, sans-serif; background: #eef2f6; color: #182230; margin: 0; padding: 24px; }
    main { max-width: 560px; margin: 40px auto; padding: 28px; background: white; border-radius: 12px; }
    label { display: block; margin-bottom: 8px; }
    input, button { box-sizing: border-box; font: inherit; padding: 12px; }
    input { width: 100%; margin-bottom: 12px; }
    button { background: #2159ad; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #596779; cursor: default; }
    #mensaje { min-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Escape de las tres salas</h1>
    <h2>Sala 1: la llave</h2>
    <p>La puerta está cerrada. Lee la pista y escribe el color de la llave.</p>
    <p id="pista"></p>
    <!-- El formulario permite enviar la respuesta pulsando Intro. -->
    <form id="formulario">
      <label for="respuesta">Color de la llave:</label>
      <input id="respuesta" type="text" autocomplete="off">
      <button id="comprobar" type="submit">Abrir puerta</button>
    </form>
    <!-- aria-live permite anunciar el resultado a lectores de pantalla. -->
    <p id="mensaje" role="status" aria-live="polite"></p>
    <p>Versión inicial: la segunda y la tercera sala están en desarrollo.</p>
    <button id="reiniciar" type="button">Reiniciar</button>
  </main>

  <script>
    // Un objeto agrupa datos y funciones relacionados.
    const llaveOriginal = {
      nombre: "Llave del cajón", // String: texto.
      numero: 1,                // Number: número.
      encontrada: false,        // Boolean: verdadero o falso.
      detalles: { color: "azul" }, // Objeto anidado dentro de otro objeto.

      // Esta propiedad contiene una función (un método del objeto).
      obtenerPista: function () {
        // this se refiere al objeto que llama al método.
        return "En el cajón hay una llave de color " + this.detalles.color + ".";
      }
    };

    // Object.assign crea una copia superficial en un objeto nuevo.
    const llave = Object.assign({}, llaveOriginal);

    // Copiamos también el objeto anidado: así no comparte la misma referencia.
    // No es una clonación profunda genérica: basta para esta estructura sencilla.
    llave.detalles = Object.assign({}, llaveOriginal.detalles);
    llave.encontrada = true; // Solo cambia la copia; el original sigue en false.

    const formulario = document.getElementById("formulario");
    const respuesta = document.getElementById("respuesta");
    const mensaje = document.getElementById("mensaje");
    const comprobar = document.getElementById("comprobar");
    document.getElementById("pista").textContent = llave.obtenerPista();

    formulario.addEventListener("submit", function (evento) {
      // Evita que el formulario recargue la página al enviarse.
      evento.preventDefault();

      try {
        // trim elimina espacios en los extremos; toLowerCase pasa a minúsculas.
        const color = respuesta.value.trim().toLowerCase();

        if (color === "") {
          // throw lanza una excepción que se recoge en el catch de abajo.
          throw new Error("Escribe un color antes de abrir la puerta.");
        }

        if (color !== llave.detalles.color) {
          throw new Error("Ese color no es correcto. Vuelve a leer la pista.");
        }

        mensaje.textContent = "¡Puerta abierta! Primera sala superada.";
        comprobar.disabled = true;
        respuesta.disabled = true;
      } catch (error) {
        // Mostramos el problema sin detener el juego: puedes volver a intentarlo.
        mensaje.textContent = error.message;
      }
    });

    document.getElementById("reiniciar").addEventListener("click", function () {
      // Recargar restaura los datos y los controles de esta versión inicial.
      window.location.reload();
    });
  </script>
</body>
</html>
