<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Adapta el ancho de la página a la pantalla del móvil o del ordenador. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de misiones - Unidad 3</title>
    <link rel="stylesheet" href="estilos.css">
    <!-- defer espera a que el HTML esté preparado antes de ejecutar JavaScript.
         Así podemos acceder al formulario y al párrafo aunque el script esté en head. -->
    <script src="juego.js" defer></script>
</head>
<body>
    <main>
        <h1>Juego de misiones</h1>
        <p>Resuelve sumas sencillas y consigue puntos.</p>

        <!-- Cada label se une a su campo mediante for e id.
             required indica que el campo no puede quedar vacío. -->
        <!-- novalidate deja la validación a JavaScript para mostrar nuestro mensaje. -->
        <form id="formulario-jugador" novalidate>
            <label for="nombre">Nombre del jugador</label>
            <input id="nombre" type="text" required>

            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input id="fecha-nacimiento" type="date" required>

            <p>Debes tener al menos 12 años para jugar.</p>
            <button id="boton-inicio" type="submit">Comenzar</button>
        </form>

        <!-- JavaScript cambiará este mensaje al pulsar el botón.
             aria-live permite que los lectores de pantalla anuncien el cambio. -->
        <p id="mensaje" aria-live="polite">Introduce tus datos y pulsa Comenzar.</p>

        <!-- hidden oculta el panel hasta que el jugador introduce datos válidos. -->
        <section id="panel-jugador" hidden>
            <h2>Tu perfil</h2>
            <p id="nombre-jugador"></p>
            <p id="edad-jugador"></p>
        </section>
        <!-- El juego solo se muestra después de validar el perfil. -->
        <section id="zona-juego" hidden>
            <h2>Resuelve la suma</h2>
            <p id="puntuacion" aria-live="polite">Puntos: 0</p>
            <p id="suma"></p>
            <form id="formulario-respuesta" novalidate>
                <label for="respuesta">Tu respuesta</label>
                <input id="respuesta" type="number" step="1" required>
                <button id="boton-comprobar" type="submit">Comprobar</button>
                <button id="boton-siguiente" type="button">Siguiente</button>
            </form>
            <p id="mensaje-juego" aria-live="polite"></p>
            <button id="boton-ayuda" type="button">Ayuda</button>
            <h3>Sumas resueltas</h3>
            <p id="historial">Todavía no has resuelto ninguna suma.</p>
        </section>
    </main>
</body>
</html>
